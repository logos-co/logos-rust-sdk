[package]
name = "logos-lidl-gen"
version = "0.1.0"
edition = "2021"
description = "LIDL -> Rust codegen backend: typed callers and event subscribers over logos-rust-sdk"

# `ffi` (default) links logos-lidl's C archives for the `parse`/`serialize`
# frontend. Consumers that build this crate as a *build-dependency* under nixpkgs
# turn it off (`default-features = false`) — the C archives can't be put on a
# HOST build's linker path there — and feed a pre-parsed AST through `from_json`.
[features]
default = ["ffi"]
ffi = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "logos_lidl_gen"

# The CLI drives the C-ABI frontend (parse/serialize), so it needs `ffi`.
[[bin]]
name = "logos-lidl-gen"
path = "src/main.rs"
required-features = ["ffi"]

[dependencies.syn]
version = "2"
features = ["full"]
