name: CI

on:
  push:
    branches: [master, main, new_api_test]
  pull_request:
    branches: [master, main, new_api_test]

jobs:
  ipc-test:
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment; master
    # jobs must opt into it to publish to the public cache.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # The module-impl C ABI must be complete before anything is built on it:
      # logos-protocol DECLARES it and this backend generates the definitions,
      # so the two drift silently (twice now). Runs first because it is seconds
      # of codegen and needs no modules, and because a gap here is the cause of
      # the dlopen() failures the IPC test would otherwise report as a timeout.
      #
      # This is the ROOT flake, not path:./tests — the tests flake reaches
      # logos-protocol only transitively, at 0.2.0, and could not see a missing
      # 0.3 or 0.5 export.
      - name: Check the generated scaffold defines every module-impl export
        run: |
          nix build '.#checks.x86_64-linux.module-impl-abi' \
            --print-build-logs

      - name: Run IPC integration test
        run: |
          nix build 'path:./tests#checks.x86_64-linux.ipc-test' \
            --override-input logos-rust-sdk path:. \
            --print-build-logs
