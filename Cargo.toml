[package]
name = "logos-rust-sdk"
# 0.2.0 -> 0.3.0. Under cargo's 0.x rules the minor is the breaking position, and
# this release breaks in two ways:
#   * generated code now calls `PluginProxy::with_timeout`, which 0.2.0 does not
#     have — a 0.3 generator against a 0.2 runtime is E0599, so the two must move
#     together and the version is what says so;
#   * `LogosError` gained `InvalidTimeout` and is not `#[non_exhaustive]`, so a
#     downstream exhaustive `match` on it stops compiling.
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Logos Team"]
description = "Rust SDK for calling other Logos modules — binds the lp_* C ABI from logos-protocol; the runtime behind logos-lidl-gen's typed clients"
repository = "https://github.com/logos-co/logos-rust-sdk"
keywords = ["logos", "sdk", "ipc", "modules"]
categories = ["api-bindings"]

[lib]
name = "logos_rust_sdk"
path = "src/lib.rs"
# Compiled as rlib; the lp_* symbols are left unresolved and bound at final
# link time against the logos-protocol archive when CMake links the module
# plugin .so/.dylib.
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
members = [".", "lidl-gen"]
