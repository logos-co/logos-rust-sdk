[package]
name = "logos-rust-sdk"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Logos Team"]
description = "Rust SDK for calling other Logos modules via IPC, wrapping logos-module-client"
repository = "https://github.com/logos-co/logos-rust-sdk"
keywords = ["logos", "sdk", "ipc", "modules"]
categories = ["api-bindings"]

[lib]
name = "logos_rust_sdk"
path = "src/lib.rs"
# Compiled as rlib; logos_sdk_* symbols are resolved at final link time by
# liblogos_module_client when the module plugin .so/.dylib is linked by CMake.
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
members = [".", "lidl-gen"]
