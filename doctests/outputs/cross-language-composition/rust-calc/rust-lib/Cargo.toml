[package]
name = "rust_calc"
version = "1.0.0"
edition = "2021"

# Standalone crate — the empty table keeps cargo from adopting any
# workspace it finds in a parent directory.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
serde_json = "1"
logos-rust-sdk = { git = "https://github.com/logos-co/logos-rust-sdk", rev = "8b89e562a52218af6beef6fa6e3cfa12ab52e93e" }
