[package]
name = "rust_orchestrator"
version = "1.0.0"
edition = "2021"

# Standalone crate — the empty table keeps cargo from adopting any
# workspace it finds in a parent directory.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
serde_json = "1"
logos-rust-sdk = { git = "https://github.com/logos-co/logos-rust-sdk", rev = "2032c4d523972bcb00dc3d6b5be1a40e941cc812" }

[build-dependencies]
logos-lidl-gen = { git = "https://github.com/logos-co/logos-rust-sdk", rev = "2032c4d523972bcb00dc3d6b5be1a40e941cc812" }
